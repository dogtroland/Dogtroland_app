<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dogtroland</title>

  <!-- Tailwind CSS CDN for styling -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase Client SDKs (v10.8.0) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

  <!-- Header -->
  <header class="bg-emerald-800 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-2xl font-bold tracking-wide">Dogtroland</h1>
    <div id="authStatus" class="text-sm">
      <button id="loginBtn" onclick="loginWithGoogle()" class="bg-white text-emerald-800 px-4 py-2 rounded-lg font-semibold hover:bg-emerald-50 transition">
        Sign in with Google
      </button>
      <div id="userInfo" class="hidden flex items-center gap-3">
        <span id="userName" class="font-medium"></span>
        <button onclick="logout()" class="bg-red-600 text-white px-3 py-1 text-xs rounded hover:bg-red-700">Logout</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-6 space-y-8">
    
    <!-- Upload Section -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
      <h2 class="text-xl font-semibold mb-4 text-emerald-900">Upload Product / Asset</h2>
      <form id="uploadForm" onsubmit="handleUpload(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Item Title</label>
          <input type="text" id="itemTitle" required class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="e.g. Marketplace Accessory" />
        </div>
        
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Item Price (GHS)</label>
          <input type="number" id="itemPrice" step="0.01" required class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="45.00" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Select Photo / File</label>
          <input type="file" id="itemFile" accept="image/*" required class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-emerald-50 file:text-emerald-700 file:font-semibold hover:file:bg-emerald-100" />
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-emerald-700 text-white py-2 rounded-md font-semibold hover:bg-emerald-800 transition">
          Upload Directly to Firebase
        </button>
      </form>
      <p id="statusMsg" class="mt-3 text-sm font-medium text-center"></p>
    </section>

    <!-- Product Feed -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
      <h2 class="text-xl font-semibold mb-4 text-emerald-900">Active Listings</h2>
      <div id="itemsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <p class="text-gray-500 col-span-2">Loading items...</p>
      </div>
    </section>

  </main>

  <script>
    // FILL IN YOUR FIREBASE CREDENTIALS HERE:
    const firebaseConfig = {
  apiKey: "AIzaSyC_D3xZ_-1s4zejkqltQywTpuIx9X9YfsQ",
    authDomain: "dogtroland-2d963.firebaseapp.com",
    projectId: "dogtroland-2d963",
    storageBucket: "dogtroland-2d963.firebasestorage.app",
    messagingSenderId: "874627694620",
    appId: "1:874627694620:web:c4892dae95e555e6581fd9"
 };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const storage = firebase.storage();

    // Authentication Logic
    auth.onAuthStateChanged((user) => {
      const loginBtn = document.getElementById('loginBtn');
      const userInfo = document.getElementById('userInfo');
      const userName = document.getElementById('userName');

      if (user) {
        loginBtn.classList.add('hidden');
        userInfo.classList.remove('hidden');
        userName.textContent = user.displayName || user.email;
      } else {
        loginBtn.classList.remove('hidden');
        userInfo.classList.add('hidden');
      }
    });

    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch((error) => console.error("Login Error:", error));
    }

    function logout() {
      auth.signOut();
    }

    // Direct Browser File Upload
    async function handleUpload(e) {
      e.preventDefault();
      
      const user = auth.currentUser;
      if (!user) {
        alert("Please sign in first to upload files.");
        return;
      }

      const title = document.getElementById('itemTitle').value;
      const price = document.getElementById('itemPrice').value;
      const file = document.getElementById('itemFile').files[0];
      const statusMsg = document.getElementById('statusMsg');
      const submitBtn = document.getElementById('submitBtn');

      if (!file) return;

      try {
        submitBtn.disabled = true;
        statusMsg.className = "mt-3 text-sm font-medium text-center text-blue-600";
        statusMsg.textContent = "Uploading image to Firebase Storage...";

        // Step A: Send file directly to Firebase Cloud Storage
        const fileRef = storage.ref(`uploads/${Date.now()}_${file.name}`);
        const snapshot = await fileRef.put(file);
        const imageURL = await snapshot.ref.getDownloadURL();

        statusMsg.textContent = "Saving listing to Firestore...";

        // Step B: Save metadata directly to Firestore
        await db.collection("items").add({
          title: title,
          price: parseFloat(price),
          imageUrl: imageURL,
          ownerUid: user.uid,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        statusMsg.className = "mt-3 text-sm font-medium text-center text-emerald-600";
        statusMsg.textContent = "Item successfully published!";
        document.getElementById('uploadForm').reset();
      } catch (error) {
        console.error("Upload error:", error);
        statusMsg.className = "mt-3 text-sm font-medium text-center text-red-600";
        statusMsg.textContent = "Upload failed: " + error.message;
      } finally {
        submitBtn.disabled = false;
      }
    }

    // Real-Time Data Listener
    db.collection("items").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = "";

      if (snapshot.empty) {
        grid.innerHTML = `<p class="text-gray-500 col-span-2">No active items found.</p>`;
        return;
      }

      snapshot.forEach((doc) => {
        const item = doc.data();
        const card = `
          <div class="border border-gray-200 rounded-lg p-4 bg-gray-50 flex flex-col justify-between">
            <img src="${item.imageUrl}" alt="${item.title}" class="w-full h-48 object-cover rounded-md mb-3" />
            <div>
              <h3 class="font-bold text-lg text-gray-800">${item.title}</h3>
              <p class="text-emerald-700 font-semibold text-md mb-2">GH₵${item.price.toFixed(2)}</p>
            </div>
          </div>
        `;
        grid.innerHTML += card;
      });
    });
  </script>
</body>
</html>
